pluginManagement {
	repositories {
		// 腾讯云镜像前置（境内加速），fabric maven 保底（解析 fabric-loom 插件本体），阿里云 gradle-plugin 兜底
		maven {
			name = "Tencent"
			url = "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/"
		}
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}
		maven {
			name = "AliyunGradlePlugin"
			url = "https://maven.aliyun.com/repository/gradle-plugin/"
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = "mtr-next-4to3-car"
