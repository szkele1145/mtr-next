# MTR Next 构建配置
# JDK 固定为 ms-17.0.19（Microsoft OpenJDK 17.0.19 LTS），Gradle 8.10.2

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# 不走系统代理（mtr-turbo 同款配置）
systemProp.http.proxyHost=
systemProp.https.proxyHost=

# 版本
mod_version=0.36.9
maven_group=io.github.szkele1145
archives_base_name=mtr-next

# Java 路径必须纯 ASCII。gradle.properties 按 ISO-8859-1 读取，
# 含中文用户名的路径（.jdks）会 mojibake，故用 C:\jdk17 junction 指过去。
# [修复 2026-10-21] C:\jdk17 曾被误删，现重建为 junction ->
# C:\Users\一只屑\.jdks\ms-17.0.19（Microsoft OpenJDK 17.0.19 LTS）。
org.gradle.java.home=C:/jdk17
