# MTR Next 构建配置
# 工具链: C:/jdk17(纯 ASCII 路径), gradle wrapper 缓存 8.11

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# 镜像加速（与 mtr-turbo 同策略）
systemProp.http.proxyHost=
systemProp.https.proxyHost=

# 版本
mod_version=0.34.2
maven_group=io.github.szkele1145
archives_base_name=mtr-next

# Java 路径（必须纯 ASCII：gradle.properties 按 ISO-8859-1 解析，中文会 mojibake）
# C:\jdk17 是指向 F:\vibe coding工程\jdk17 的 junction（2026-10-18 建立，永久有效）
# 旧值 Z:/jdk17 依赖 build.ps1 的 subst，仅在构建期间存在，离开脚本即失效
org.gradle.java.home=C:/jdk17
